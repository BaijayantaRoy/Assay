[pytest]
markers =
    e2e: end-to-end test driving real processes (CLI binary, HTTP server, MCP stdio)
testpaths = packages/assay-core/tests backend/tests tests/e2e tests/benchmark
filterwarnings =
    ignore::DeprecationWarning

# A hung end-to-end test is a failed end-to-end test. Without this, a deadlocked
# subprocess blocks CI until the job timeout and reports nothing useful; with it,
# the offending test is named. Requires pytest-timeout (in requirements-dev.txt).
timeout = 120
timeout_method = thread
