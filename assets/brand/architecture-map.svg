<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-label="Assay high-level architecture map">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111725"/><stop offset="1" stop-color="#080B11"/></linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#313A78"/><stop offset="1" stop-color="#162454"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59677E"/></marker>
  </defs>
  <rect width="1400" height="620" rx="34" fill="url(#canvas)"/>
  <text x="60" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#F7F9FC">How Assay turns prompts into evidence</text>
  <text x="60" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#96A3B8">One portable artifact · one engine · every interface · proof that travels with the code</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="275" height="300" rx="24" fill="#171D2A" stroke="#D9A43F" stroke-width="2"/>
    <circle cx="112" cy="222" r="26" fill="#372D19"/><path d="M102 208h20l10 10v28h-30z" fill="none" stroke="#F2B84B" stroke-width="3"/><path d="M122 208v10h10" fill="none" stroke="#F2B84B" stroke-width="3"/>
    <text x="154" y="219" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F7F9FC">PromptFile</text>
    <text x="154" y="245" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="#F2B84B">*.prompt.md</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#B8C2D2">
      <text x="96" y="302">◆ Template + schemas</text><text x="96" y="340">◆ Model + parameters</text><text x="96" y="378">◆ Guardrails</text><text x="96" y="416">◆ Embedded eval cases</text>
    </g>
    <text x="96" y="449" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6F7D93">Canonical source lives in Git</text>
  </g>

  <path d="M350 320h105" stroke="#59677E" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="475" y="145" width="390" height="350" rx="28" fill="url(#engine)" stroke="#7C83FF" stroke-width="2"/>
    <circle cx="550" cy="225" r="44" fill="#111725" stroke="#7C83FF" stroke-width="2"/>
    <path d="M527 247l20-43c2-5 8-5 10 0l20 43M537 228h29" fill="none" stroke="#F2B84B" stroke-width="7" stroke-linecap="round"/><path d="M577 231l9 9-9 9-9-9z" fill="#34D399"/>
    <text x="620" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#F7F9FC">Assay engine</text>
    <text x="620" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#BAC5E8">Parse · run · observe · verify</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">
      <rect x="520" y="302" width="135" height="48" rx="14" fill="#111725" stroke="#5361C8"/><text x="587" y="332" fill="#DCE2FF">Evaluations</text>
      <rect x="685" y="302" width="135" height="48" rx="14" fill="#111725" stroke="#5361C8"/><text x="752" y="332" fill="#DCE2FF">Trajectories</text>
      <rect x="520" y="370" width="135" height="48" rx="14" fill="#111725" stroke="#5361C8"/><text x="587" y="400" fill="#DCE2FF">Red team</text>
      <rect x="685" y="370" width="135" height="48" rx="14" fill="#111725" stroke="#5361C8"/><text x="752" y="400" fill="#DCE2FF">Governance</text>
    </g>
    <text x="670" y="461" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#96A3B8">Unverified stays “not checked”</text>
  </g>

  <path d="M880 320h105" stroke="#59677E" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1005" y="170" width="335" height="300" rx="24" fill="#12231F" stroke="#34D399" stroke-width="2"/>
    <circle cx="1060" cy="222" r="27" fill="#17372C"/><path d="M1047 222l9 9 18-20" fill="none" stroke="#69E5AE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1102" y="219" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F7F9FC">Portable proof</text>
    <text x="1102" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#69E5AE">REVIEWABLE · REPEATABLE</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#B8C2D2">
      <text x="1040" y="302">✓ CI exit codes</text><text x="1040" y="340">✓ Measured scores</text><text x="1040" y="378">✓ Security evidence</text><text x="1040" y="416">✓ Audit-ready gaps</text>
    </g>
    <text x="1040" y="449" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#6F9F8D">Evidence survives any interface</text>
  </g>

  <g font-family="ui-monospace,Consolas,monospace" font-size="15" text-anchor="middle">
    <rect x="420" y="540" width="120" height="42" rx="13" fill="#171D2A" stroke="#354058"/><text x="480" y="566" fill="#D7DDEA">CLI</text>
    <rect x="555" y="540" width="120" height="42" rx="13" fill="#171D2A" stroke="#354058"/><text x="615" y="566" fill="#D7DDEA">MCP</text>
    <rect x="690" y="540" width="120" height="42" rx="13" fill="#171D2A" stroke="#354058"/><text x="750" y="566" fill="#D7DDEA">REST</text>
    <rect x="825" y="540" width="120" height="42" rx="13" fill="#171D2A" stroke="#354058"/><text x="885" y="566" fill="#D7DDEA">SDKs</text>
    <rect x="960" y="540" width="120" height="42" rx="13" fill="#171D2A" stroke="#354058"/><text x="1020" y="566" fill="#D7DDEA">Workbench</text>
  </g>
</svg>
