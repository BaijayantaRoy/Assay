[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-client"
version = "1.0.0"
description = "Python SDK for Assay — one API for local PromptFiles and remote servers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Embedded mode needs the engine; remote mode does not.
local = ["assay-core>=1.0.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
