blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/BaijayantaRoy/Assay/security/advisories/new
    about: >
      Report privately, not as a public issue. This includes any case where Assay
      reported a number that overstated its own security.
  - name: Spec change (PromptFile v1)
