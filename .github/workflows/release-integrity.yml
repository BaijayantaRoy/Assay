name: Release integrity

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can be pushed from any commit, and ci.yml only runs on branches and pull
  # requests. Without this gate a tag on an unverified commit would still produce
  # attested, published artifacts.
  verify:
    name: Re-verify at the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          pip install -e "packages/assay-core[dev]" -e packages/assay-cli -e packages/assay-mcp
          pip install -r backend/requirements-dev.txt

      - name: Core, backend, end-to-end and benchmark suites
        run: |
          python -m pytest packages/assay-core/tests -q
          python -m pytest backend/tests -q
          python -m pytest tests/e2e -q
          python -m pytest tests/benchmark -q

      - name: Shipped artifacts conform, and every mutation anchor is live
        run: |
          assay lint && assay spec validate .
          python tests/mutation/run_mutations.py --check

  build-and-attest:
    name: Build, inventory, attest and release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Published assets contain no generator metadata
        run: python scripts/strip_asset_metadata.py --check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/sdk-typescript/package-lock.json
            packages/promptfile-typescript/package-lock.json

      - name: A release tag matches every package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          wanted = os.environ['RELEASE_TAG'].removeprefix('v')
          manifests = [
              pathlib.Path('packages/assay-core/pyproject.toml'),
              pathlib.Path('packages/assay-cli/pyproject.toml'),
              pathlib.Path('packages/assay-mcp/pyproject.toml'),
              pathlib.Path('packages/sdk-python/pyproject.toml'),
          ]
          found = {str(path): tomllib.loads(path.read_text(encoding='utf-8'))['project']['version']
                   for path in manifests}
          ts = pathlib.Path('packages/sdk-typescript/package.json')
          found[str(ts)] = json.loads(ts.read_text(encoding='utf-8'))['version']
          reader = pathlib.Path('packages/promptfile-typescript/package.json')
          found[str(reader)] = json.loads(reader.read_text(encoding='utf-8'))['version']
          wrong = {path: version for path, version in found.items() if version != wanted}
          if wrong:
              raise SystemExit(f'tag v{wanted} does not match package versions: {wrong}')
          print(f'all package manifests match v{wanted}')
          PY

      - name: Build Python distributions
        run: |
          python -m pip install build==1.5.0
          python scripts/sync_core_resources.py --check
          python -m build packages/assay-core --outdir dist
          python scripts/check_core_distribution.py dist
          python -m build packages/assay-cli --outdir dist
          python -m build packages/assay-mcp --outdir dist
          python -m build packages/sdk-python --outdir dist

      - name: Build TypeScript SDK package
        run: |
          npm ci --prefix packages/sdk-typescript
          npm run build --prefix packages/sdk-typescript
          npm pack ./packages/sdk-typescript --pack-destination dist

      - name: Build independent PromptFile package
        run: |
          npm ci --prefix packages/promptfile-typescript
          npm run check-schema --prefix packages/promptfile-typescript
          npm test --prefix packages/promptfile-typescript
          npm pack ./packages/promptfile-typescript --pack-destination dist

      - name: Verify publishable package inventory
        run: python scripts/check_release_inventory.py dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/assay.spdx.json
          upload-artifact: false

      - name: Write SHA-256 manifest
        run: |
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          files = sorted(path for path in root.iterdir()
                         if path.is_file() and path.name != 'SHA256SUMS')
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.name}')
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'hashed {len(files)} release files')
          PY

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Attest SBOM association
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: dist/*
          sbom-path: dist/assay.spdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assay-release-${{ github.ref_name }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          text = pathlib.Path('docs/CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## )', text, re.S | re.M)
          if not match:
              raise SystemExit(f'docs/CHANGELOG.md has no section for {version}')
          notes = match.group(1).strip()
          notes += ('\n\n---\n\nEvery file below is listed in `SHA256SUMS` and carries a GitHub '
                    'build-provenance attestation. Verify one with\n'
                    '`gh attestation verify <file> --repo ${{ github.repository }}`.\n')
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" dist/* \
            --title "Assay $RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
