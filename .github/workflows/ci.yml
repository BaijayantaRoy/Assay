name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The engine. Runs on every supported Python because assay-core is a library other
  # people install — a 3.10 break is a break for real users, not a rounding error.
  # No secrets needed: the `echo` provider makes the whole runtime testable offline.
  # ---------------------------------------------------------------------------
  core:
    name: assay-core (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install packages
        run: |
          pip install -e "packages/assay-core[dev]" -e packages/assay-cli -e packages/assay-mcp
          pip install pytest

      - name: Run core tests
        run: python -m pytest packages/assay-core/tests -v

      - name: Curated pack source matches generated PromptFiles
        run: python scripts/build_curated_packs.py --check

      - name: Bundled core resources match canonical spec files
        run: python scripts/sync_core_resources.py --check

      - name: Published assets contain no generator metadata
        if: matrix.python == '3.12'
        run: python scripts/strip_asset_metadata.py --check

      # Coverage says which lines ran, not whether anything would have failed had they
      # been wrong. This checks that every mutation in tests/mutation still points at
      # real code — a stale anchor silently drops a check from the suite. ~1 second.
      # The full run is minutes, so it lives in mutation.yml on a schedule.
      - name: Mutation anchors still valid
        run: python tests/mutation/run_mutations.py --check

      - name: Bounded evaluation keeps evidence and halves synthetic wall time
        if: matrix.python == '3.12'
        run: python tests/performance/run_eval_throughput.py --check

      - name: Thousand-artifact discovery and render budget
        if: matrix.python == '3.12'
        run: python tests/performance/run_repository_scale.py --check

      - name: Competitive benchmark scorer refuses incomplete evidence
        if: matrix.python == '3.12'
        run: |
          python -m pytest tests/benchmark -v
          python benchmarks/assurance-wedge/score.py --check
          python benchmarks/assurance-wedge/plan_trials.py --check
          python benchmarks/assurance-wedge/export_operator_kit.py --check

      - name: Verify plugins resolve through real entry points
        run: |
          python - <<'PY'
          from assay_core import get_registry
          inventory = get_registry().describe()
          for group in ("assay.renderers", "assay.providers", "assay.evaluators",
                        "assay.guardrails", "assay.stores", "assay.importers",
                        "assay.tracers"):
              records = inventory[group]
              assert records, f"{group} discovered nothing"
              broken = [r for r in records if r["error"]]
              assert not broken, f"{group} has load failures: {broken}"
              assert all(r["source"] == "entry_point" for r in records), \
                  f"{group} fell back to direct registration instead of entry points"
              print(f"  {group}: {len(records)} plugins OK")
          PY

  windows:
    name: Windows contract (py3.12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          pip install -e "packages/assay-core[dev]" -e packages/assay-cli -e packages/assay-mcp
          pip install -r backend/requirements-dev.txt

      - name: Core and CLI tests
        run: |
          python -m pytest packages/assay-core/tests -v
          python -m pytest tests/e2e/test_cli_e2e.py tests/e2e/test_mcp_e2e.py -v

      - name: Legacy console encoding cannot crash output
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "cp1252"
          assay ls
          assay test --json | Out-Null

  # ---------------------------------------------------------------------------
  # Spec conformance and the CLI's exit-code contract. These are the promises the
  # README makes; a failure here means the documentation is lying.
  # ---------------------------------------------------------------------------
  conformance:
    name: Spec & CLI conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e packages/assay-core -e packages/assay-cli -e packages/assay-mcp

      - name: JSON Schema is itself valid
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("spec/schemas/promptfile-v1.schema.json"))
          jsonschema.Draft202012Validator.check_schema(schema)
          print("promptfile-v1 schema is a valid Draft 2020-12 schema")

          trial_schema = json.load(open("benchmarks/assurance-wedge/trial.schema.json"))
          jsonschema.Draft202012Validator.check_schema(trial_schema)
          trials = json.load(open("benchmarks/assurance-wedge/trials/current.json"))
          jsonschema.Draft202012Validator(trial_schema).validate(trials)
          print("assurance-wedge trial ledger conforms to its schema")
          PY

      - name: Every PromptFile in the repo validates
        run: assay spec validate .

      - name: CLI exit-code contract
        run: |
          set +e
          assay init /tmp/ws --name ci > /dev/null
          cd /tmp/ws

          assay test;             [ $? -eq 0 ] || { echo "expected 0 on passing evals"; exit 1; }
          assay lint;             [ $? -eq 0 ] || { echo "expected 0 on clean lint"; exit 1; }

          cat > prompts/fail.prompt.md <<'EOF'
          ---
          promptfile: 1
          id: ci/failing
          name: Failing
          description: deliberately failing eval
          model: {primary: echo/echo}
          evals:
            - id: impossible
              assert:
                - {type: contains, value: "never-appears"}
          ---
          body
          EOF
          assay test ci/failing > /dev/null 2>&1
          [ $? -eq 4 ] || { echo "expected exit 4 on eval failure"; exit 1; }

          printf -- "---\npromptfile: 1\nid: NOT VALID\n---\nx\n" > prompts/bad.prompt.md
          assay lint > /dev/null 2>&1
          [ $? -eq 3 ] || { echo "expected exit 3 on validation failure"; exit 1; }

          echo "exit-code contract holds"

      - name: Red-team the example harness
        run: |
          cd /tmp/ws
          cat > prompts/reader.prompt.md <<'EOF'
          ---
          promptfile: 1
          id: ci/reader
          name: Reader
          summary: Reads notes; used as the red-team regression target.
          kind: harness
          model:
            primary: echo/agent
            provider_params:
              echo:
                script:
                  - { tool: mock.search, arguments: { query: notes } }
                  - { text: "Summarised." }
          harness:
            max_iterations: 4
            budget: { cost_usd: 1.0 }
            control:
              deny: [shell.run, http.get]
              max_repeated_calls: 2
              mock_responses:
                mock.search: "Project notes."
          tools:
            - { ref: mock.search }
          ---
          Summarise the notes.
          EOF
          assay redteam ci/reader --max-asr 0.0 --quiet

      - name: MCP server responds on both protocol revisions
        run: |
          python - <<'PY'
          import json, subprocess, sys
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize",
               "params": {"protocolVersion": "2025-11-25", "clientInfo": {"name": "ci", "version": "1"}}},
              {"jsonrpc": "2.0", "id": 2, "method": "server/discover", "params": {}},
              {"jsonrpc": "2.0", "id": 3, "method": "prompts/list", "params": {}},
              {"jsonrpc": "2.0", "id": 4, "method": "tools/list", "params": {}},
          ]
          proc = subprocess.run(
              [sys.executable, "-m", "assay_mcp.server"],
              input="\n".join(json.dumps(r) for r in requests),
              capture_output=True, text=True, cwd="/tmp/ws",
          )
          results = {json.loads(l)["id"]: json.loads(l) for l in proc.stdout.splitlines()}
          assert results[1]["result"]["protocolVersion"] == "2025-11-25", "legacy handshake broken"
          assert results[2]["result"]["protocolVersion"] == "2026-07-28", "stateless discover broken"
          assert results[3]["result"]["prompts"], "prompts/list returned nothing"
          assert len(results[4]["result"]["tools"]) >= 9, "tools missing"
          print("MCP dual-revision support verified")
          PY

  # ---------------------------------------------------------------------------
  # End-to-end: the real binary, a real HTTP server, a real MCP process.
  # Run as separate steps so a failure names the surface, and so one module's
  # resource use cannot stall another.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install everything a user would
        run: |
          pip install -e packages/assay-core -e packages/assay-cli -e packages/assay-mcp
          pip install -r backend/requirements-dev.txt

      - name: The assay binary is on PATH
        run: |
          which assay
          assay version --json

      - name: CLI end-to-end
        run: python -m pytest tests/e2e/test_cli_e2e.py -v

      - name: REST API end-to-end
        run: python -m pytest tests/e2e/test_api_e2e.py -v

      - name: OpenAI-compatible proxy end-to-end
        run: python -m pytest tests/e2e/test_proxy_e2e.py -v

      - name: MCP end-to-end
        run: python -m pytest tests/e2e/test_mcp_e2e.py -v

      - name: Cross-surface parity
        run: python -m pytest tests/e2e/test_parity_e2e.py -v

      # The UI reads these field names out of `/v1`. TypeScript types are erased at
      # runtime and check nothing about what the server sends, so a backend rename
      # would typecheck on both sides and produce `undefined` in the browser.
      - name: Web UI contract
        run: python -m pytest tests/e2e/test_ui_contract_e2e.py -v

  # ---------------------------------------------------------------------------
  # No key material, ever. This job exists because the repository previously
  # shipped a public key alongside a licensing layer (see ADR-0007).
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: No key material tracked
        run: |
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$|id_rsa|\.db$'; then
            echo "::error::key material or database committed to the repository"
            exit 1
          fi
          echo "no key material tracked"

      - name: No credentials in source
        run: |
          if grep -rEn "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA )?PRIVATE KEY)" \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.md' \
               --include='*.yaml' --include='*.yml' --include='*.json' \
               backend packages spec docs frontend/app frontend/lib 2>/dev/null; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credentials found in source"

      - name: Third-party actions are commit-pinned
        run: |
          python - <<'PY'
          import pathlib, re
          failures = []
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = re.match(r'\s*(?:-\s*)?uses:\s*([^\s#]+)', line)
                  if not match or match.group(1).startswith('./'):
                      continue
                  target = match.group(1)
                  ref = target.rsplit('@', 1)[-1] if '@' in target else ''
                  if not re.fullmatch(r'[0-9a-f]{40}', ref):
                      failures.append(f'{path}:{number}: {target}')
          if failures:
              raise SystemExit('Unpinned external actions:\n' + '\n'.join(failures))
          print('all external actions use immutable 40-character commits')
          PY

  backend:
    name: Backend API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run tests
        run: python -m pytest backend/tests/ -v

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/sdk-typescript/package-lock.json

      - name: Typecheck, build, and stream contract
        working-directory: packages/sdk-typescript
        run: |
          npm ci
          npm run typecheck
          npm test

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SDK and embedded runtime
        run: pip install -e "packages/assay-core[dev]" -e "packages/sdk-python[local]"

      - name: Embedded streaming and bounded-eval contracts
        run: python -m pytest packages/sdk-python/tests -v

  promptfile-typescript:
    name: Independent PromptFile reader
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/promptfile-typescript/package-lock.json

      - name: Canonical schema and cross-language corpus
        working-directory: packages/promptfile-typescript
        run: |
          npm ci
          npm run check-schema
          npm test

      - name: Dependency audit
        working-directory: packages/promptfile-typescript
        run: npm audit --audit-level=high

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser-test backend and Chromium
        run: |
          pip install -e packages/assay-core -e packages/assay-cli -e packages/assay-mcp
          pip install -r backend/requirements.txt
          cd frontend
          npx playwright install --with-deps chromium

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Browser accessibility and responsive contracts
        working-directory: frontend
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-evidence
          path: |
            frontend/test-results/browser
            frontend/playwright-report
          if-no-files-found: ignore

  visual-regression:
    name: Visual Regression (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install visual-test runtime
        shell: pwsh
        run: |
          pip install -e packages/assay-core -e packages/assay-cli -e packages/assay-mcp
          pip install -r backend/requirements.txt
          Set-Location frontend
          npm ci
          npx playwright install chromium

      - name: Compare reviewed Windows baselines
        working-directory: frontend
        run: npm run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-differences
          path: |
            frontend/test-results/browser
            frontend/playwright-report
          if-no-files-found: ignore

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [core, conformance, e2e, backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t assay-backend .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t assay-frontend .
